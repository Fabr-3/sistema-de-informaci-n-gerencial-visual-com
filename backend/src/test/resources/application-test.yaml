# Perfil de pruebas: base de datos aislada de la de desarrollo.
spring:
  datasource:
    url: jdbc:postgresql://localhost:${DB_PUERTO:5432}/proyecto_visual_com_test
    username: ${DB_USUARIO:postgres}
    password: ${DB_CONTRASENA:postgres}

app:
  seguridad:
    jwt:
      secreto: solo-pruebas-visual-com-clave-jwt-0123456789abcdef
    refresco:
      cookie-segura: false
    administrador-inicial:
      email: admin@visual.com.bo
      contrasena: admin123456
      debe-cambiar-contrasena: false
  respaldos:
    directorio: ./target/respaldos-prueba
    programado: false
  comercial:
    directorio-contratos: ./target/contratos-prueba
  subcontratacion:
    directorio-comprobantes: ./target/comprobantes-prueba
