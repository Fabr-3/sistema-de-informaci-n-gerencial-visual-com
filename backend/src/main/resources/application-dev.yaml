# Perfil de desarrollo local. NO usar estos valores en produccion.
spring:
  datasource:
    # DB_PUERTO=5433 usa la base del contenedor Docker (docker-compose.yml)
    url: jdbc:postgresql://localhost:${DB_PUERTO:5432}/proyecto-visual-com
    username: ${DB_USUARIO:postgres}
    password: ${DB_CONTRASENA:postgres}

app:
  seguridad:
    jwt:
      secreto: solo-desarrollo-visual-com-clave-jwt-0123456789abcdef
    refresco:
      # En local se trabaja con HTTP, por lo que la cookie no puede ser Secure
      cookie-segura: false
    administrador-inicial:
      email: admin@visual.com.bo
      contrasena: admin123456
      debe-cambiar-contrasena: false
