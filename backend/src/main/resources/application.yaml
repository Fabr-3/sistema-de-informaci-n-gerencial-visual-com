# Configuracion comun. Los valores sensibles se leen de variables de entorno;
# el perfil "dev" (por defecto) define valores locales solo para desarrollo.
spring:
  application:
    name: backend
  profiles:
    default: dev
  datasource:
    url: ${DB_URL}
    username: ${DB_USUARIO}
    password: ${DB_CONTRASENA}
  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo gestiona Flyway; Hibernate solo valida el mapeo
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # Contratos firmados escaneados (ver ServicioContratos.TAMANO_MAXIMO_FIRMADO)
      max-file-size: 10MB
      max-request-size: 11MB

server:
  error:
    include-stacktrace: never
    include-message: never

app:
  zona-horaria: America/La_Paz
  seguridad:
    jwt:
      secreto: ${JWT_SECRETO}
      emisor: visual-com
      duracion-acceso: 15m
    refresco:
      duracion: 7d
      nombre-cookie: visual_refresco
      cookie-segura: true
    bloqueo:
      intentos-maximos: 5
      duracion: 15m
    administrador-inicial:
      nombre-usuario: admin
      nombres: Administrador
      apellido-paterno: Sistema
      email: ${ADMIN_EMAIL}
      contrasena: ${ADMIN_CONTRASENA_INICIAL}
      debe-cambiar-contrasena: true
  respaldos:
    directorio: ${RESPALDOS_DIRECTORIO:./respaldos}
    ruta-pg-dump: pg_dump
    programado: true
    # Respaldo automatico diario a las 02:00
    cron: "0 0 2 * * *"
    tiempo-maximo: 10m
  finanzas:
    # Monto (Bs) desde el cual un movimiento reciente se destaca en el tablero del gerente
    umbral-movimiento-significativo: 5000
    # Dias hacia atras que abarcan los movimientos destacados
    dias-movimientos-recientes: 30
  gerencial:
    # Dias en mantenimiento desde los que se alerta un mantenimiento prolongado
    dias-mantenimiento-prolongado: 7
    # Dias sin uso de un equipo disponible desde los que se alerta
    dias-sin-uso: 90
    # Mantenimientos correctivos en el ultimo año que indican fallas recurrentes
    correctivos-fallas-recurrentes: 3
    # Proyectos contratados desde los que un cliente se considera recurrente
    proyectos-cliente-recurrente: 2
  activos:
    # Porcentaje del intervalo de horas desde el que se avisa el mantenimiento preventivo
    porcentaje-alerta-mantenimiento: 90
  empresa:
    # Datos que se imprimen en cotizaciones y contratos
    razon-social: Visual Com S.R.L.
    direccion: "c/ Lucas Jaimes #76, Piso 1, Of. 2, Miraflores"
    ciudad: La Paz
    email: info@visual.com.bo
    telefono: ""
    nit: ""
  comercial:
    # Revision diaria de cotizaciones vencidas a las 00:10
    cron-vencimiento-cotizaciones: "0 10 0 * * *"
    directorio-contratos: ${CONTRATOS_DIRECTORIO:./documentos/contratos}
