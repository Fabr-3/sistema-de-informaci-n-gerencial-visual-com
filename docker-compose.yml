# Base de datos PostgreSQL del proyecto para desarrollo.
# Uso: docker compose up -d   (ver "Base de datos con Docker" en el README)
# Las credenciales por defecto son solo de desarrollo; se pueden cambiar con
# variables de entorno o un archivo .env (ver .env.example).
name: visual-com

services:
  base-datos:
    image: postgres:18.6-alpine
    container_name: visual-com-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NOMBRE:-proyecto-visual-com}
      POSTGRES_USER: ${DB_USUARIO:-postgres}
      POSTGRES_PASSWORD: ${DB_CONTRASENA:-postgres}
      TZ: America/La_Paz
      PGTZ: America/La_Paz
    ports:
      # 5433 en el equipo para convivir con un PostgreSQL local en 5432
      - "127.0.0.1:${DB_PUERTO:-5433}:5432"
    volumes:
      - datos-postgres:/var/lib/postgresql
      - ./database/docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  datos-postgres:
